<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turniej holenderski</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d6fd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turniej">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f7;--fg:#1c2330;--card:#fff;--mut:#667085;--acc:#1d6fd8;--accfg:#fff;--bd:#d9dde5;--ok:#1f9d55;--hi:#fff6d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--fg:#e8ebf0;--card:#1c222c;--mut:#9aa4b2;--acc:#4c9aff;--accfg:#08111f;--bd:#2f3744;--ok:#4cc38a;--hi:#3a3420}}
:root[data-theme="dark"]{--bg:#12161d;--fg:#e8ebf0;--card:#1c222c;--mut:#9aa4b2;--acc:#4c9aff;--accfg:#08111f;--bd:#2f3744;--ok:#4cc38a;--hi:#3a3420}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 Arial,Helvetica,sans-serif}
#app{max-width:560px;margin:0 auto;padding:12px 12px 84px}
h1{font-size:19px;margin:4px 0 2px}.mut{color:var(--mut);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:18px;padding:7px 13px;font-size:15px}
.chip.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}.chip.done{border-color:var(--ok)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:14px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.sb{text-align:center;margin-bottom:4px}.sb b{font-size:30px;letter-spacing:.05em}
.tm{border-top:1px solid var(--bd);padding-top:6px;margin-top:6px}
.th{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.ts{display:flex;gap:6px;align-items:center;text-transform:none}
.ts button{width:32px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);font-size:16px}
.pl{display:flex;align-items:center;gap:6px;padding:4px 0}
.nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}.nm small{color:var(--mut);font-size:.75em}
.gb{min-width:40px;text-align:center;font-size:14px}
button{font:inherit;color:inherit}
.gp,.gm{width:40px;height:40px;border-radius:10px;border:0;font-size:24px;font-weight:700;line-height:1;color:#fff;touch-action:manipulation}
.gp{background:#1f9d55}.gm{background:#d64545}
.btn{width:100%;padding:13px;border-radius:12px;border:0;background:var(--acc);color:var(--accfg);font-weight:700;font-size:16px;margin:8px 0}
.btn.s{background:var(--card);color:var(--fg);border:1px solid var(--bd);font-weight:400}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mut)}
input,select,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
textarea{min-height:140px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pr{display:flex;align-items:center;gap:8px;margin:6px 0}.cd{min-width:34px;text-align:center;font-weight:700;color:var(--acc)}
table{width:100%;border-collapse:collapse;table-layout:fixed}td,th{padding:8px 3px;border-bottom:1px solid var(--bd);text-align:center;font-size:15px}
th{font-size:12px;color:var(--mut);font-weight:400}td.n,th.n{text-align:left}th.c{width:40px}th.h{width:34px}td.n .nm{font-size:15px}
tr.top td{background:var(--hi)}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;padding:14px 2px;background:none;border:0;font-size:14px;color:var(--mut)}#nav button.on{color:var(--acc);font-weight:700}
</style></head><body>
<div id="app"></div>
<div id="nav"><button data-t="m">Mecze</button><button data-t="r">Ranking</button><button data-t="z">Zawodnicy</button><button data-t="s">Ustawienia</button></div>
<script>
window.onerror=function(m,u,l){if(document.getElementById('app')&&document.getElementById('app').innerHTML)return;document.body.insertAdjacentHTML('afterbegin','<pre style="color:#f55;white-space:pre-wrap;padding:12px">Błąd: '+m+' (linia '+l+')</pre>')};
const $=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem('th1'))}catch(e){}
S=S||{k:4,P:6,R:9,cat:'Rocznik 2019',names:'',teams:null,sc:{},rd:0,tab:'s',q:null};
['w','d','g'].forEach(function(p,i){if(S[p]==null)S[p]=[3,1,1][i]});if(S.nk==null)S.nk=S.k;if(S.nP==null)S.nP=S.P;if(S.nR==null)S.nR=S.R;
const save=()=>{try{localStorage.setItem('th1',JSON.stringify(S))}catch(e){}};
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const code=(i,k=S.k)=>String.fromCharCode(65+Math.floor(i/k))+(i%k+1);
const raw=i=>(S.names.split('\n')[i]||'').trim();
const nm=i=>raw(i)?esc(raw(i))+' <small>'+code(i)+'</small>':'<b>'+code(i)+'</b>';
const pitch=m=>'Boisko '+String.fromCharCode(65+m);
const num=(v,d)=>{v=parseInt(v,10);return isNaN(v)?d:Math.max(0,Math.min(99,v))};

/* Generator harmonogramu: symulowane wyżarzanie. Runda 1 = grupy literowe (A1..A4 = drużyna).
   Kara za: powtórzonego partnera (10), powtórzonego rywala (3), tę samą parę jako partner i rywal (1), to samo boisko (0.6). */
function gen(P,k,R,iters,seed){
 const N=2*P*k,nt=2*P;let s=seed;
 const rnd=()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296},ri=n=>Math.floor(rnd()*n);
 const tm=[];
 for(let r=0;r<R;r++){let p=[...Array(N).keys()];if(r)for(let i=N-1;i>0;i--){const j=ri(i+1);[p[i],p[j]]=[p[j],p[i]]}
  tm.push(Array.from({length:nt},(_,t)=>p.slice(t*k,t*k+k)))}
 const T=new Int16Array(N*N),O=new Int16Array(N*N),PC=new Int16Array(N*P);let c=0;const WT=10,WO=3,WX=1,WP=.6;
 const iT=(i,j,d)=>{const a=i*N+j,b=j*N+i;if(d>0){c+=WT*T[a]+WX*O[a];T[a]=T[b]=T[a]+1}else{T[a]=T[b]=T[a]-1;c-=WT*T[a]+WX*O[a]}};
 const iO=(i,j,d)=>{const a=i*N+j,b=j*N+i;if(d>0){c+=WO*O[a]+WX*T[a];O[a]=O[b]=O[a]+1}else{O[a]=O[b]=O[a]-1;c-=WO*O[a]+WX*T[a]}};
 const iP=(i,p,d)=>{const a=i*P+p;if(d>0){c+=WP*PC[a];PC[a]++}else{PC[a]--;c-=WP*PC[a]}};
 const rem=(x,t,i)=>{const a=x[t][i];for(const m of x[t])if(m>=0&&m!=a)iT(a,m,-1);for(const o of x[t^1])if(o>=0)iO(a,o,-1);iP(a,t>>1,-1);x[t][i]=-1;return a};
 const add=(x,t,i,a)=>{for(const m of x[t])if(m>=0)iT(a,m,1);for(const o of x[t^1])if(o>=0)iO(a,o,1);iP(a,t>>1,1);x[t][i]=a};
 const sw=(x,ta,ia,tb,ib)=>{const a=rem(x,ta,ia),b=rem(x,tb,ib);add(x,tb,ib,a);add(x,ta,ia,b)};
 for(const x of tm){for(let t=0;t<nt;t++){for(let i=0;i<k;i++){for(let j=i+1;j<k;j++)iT(x[t][i],x[t][j],1);iP(x[t][i],t>>1,1)}}
  for(let m=0;m<P;m++)for(const a of x[2*m])for(const b of x[2*m+1])iO(a,b,1)}
 const t0=3,t1=.08;
 for(let it=0;it<iters;it++){
  const temp=t0*Math.pow(t1/t0,it/iters),x=tm[1+ri(R-1)],old=c;
  const ta=ri(nt);let tb=ri(nt-1);if(tb>=ta)tb++;
  if(rnd()<.8){const ia=ri(k),ib=ri(k);sw(x,ta,ia,tb,ib);const d=c-old;if(d>0&&rnd()>=Math.exp(-d/temp))sw(x,ta,ia,tb,ib)}
  else{if((ta^1)==tb)continue;for(let i=0;i<k;i++)sw(x,ta,i,tb,i);const d=c-old;if(d>0&&rnd()>=Math.exp(-d/temp))for(let i=0;i<k;i++)sw(x,ta,i,tb,i)}
 }
 let pr=0,or=0;for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){pr+=Math.max(0,T[i*N+j]-1);or+=Math.max(0,O[i*N+j]-1)}
 return{teams:tm,q:{pr,or}};
}

const sc=(r,m)=>S.sc[r+'-'+m];
const full=c=>c&&c[0]!=null&&c[1]!=null;
const done=r=>{for(let m=0;m<S.P;m++)if(!full(sc(r,m)))return false;return true};

const gs=(r,i)=>(S.gs&&S.gs[r+'-'+i])||0;
const tl=(a,r,m,s)=>a.map(i=>{const at=' data-i="'+i+'" data-m="'+m+'" data-s="'+s+'"';
 return '<div class="pl"><div class="nm">'+nm(i)+'</div><span class="gb">'+(gs(r,i)?'⚽'+gs(r,i):'')+'</span><button class="gp" data-g="1"'+at+'>+</button><button class="gm" data-g="-1"'+at+'>−</button></div>'}).join('');
function matches(){
 let h='<h1>'+esc(S.cat)+' · '+S.k+'×'+S.k+'</h1><div class="mut">'+S.P+' boisk · '+2*S.P*S.k+' zawodników<br>Zielony + = gol zawodnika (liczy się też jego drużynie), czerwony − cofa gola. „bez strzelca” zmienia sam wynik drużyny (np. gol samobójczy).</div><div class="chips">';
 for(let r=0;r<S.R;r++)h+='<button class="chip'+(r==S.rd?' on':'')+(done(r)?' done':'')+'" data-r="'+r+'">'+(r+1)+(done(r)?' ✓':'')+'</button>';
 h+='</div>';
 const x=S.teams[S.rd];
 for(let m=0;m<S.P;m++){const c=sc(S.rd,m)||[null,null];
  h+='<div class="card"><h3>Runda '+(S.rd+1)+' · '+pitch(m)+'</h3><div class="sb"><b>'+(c[0]==null?'–':c[0])+' : '+(c[1]==null?'–':c[1])+'</b></div>';
  [0,1].forEach(s=>{h+='<div class="tm"><div class="th"><span>Drużyna '+(s+1)+'</span><span class="ts">bez strzelca <button data-m="'+m+'" data-s="'+s+'" data-d="-1">−</button><button data-m="'+m+'" data-s="'+s+'" data-d="1">+</button></span></div>'+tl(x[2*m+s],S.rd,m,s)+'</div>'});
  h+='</div>'}
 return h}
/* Klasyfikacja: punkty (wygrana/remis + bramki), przy remisie: bramki, potem wygrane. */
function stand(){
 const N=2*S.P*S.k,pt=Array(N).fill(0),pl=Array(N).fill(0),gl=Array(N).fill(0),w=Array(N).fill(0);let played=0;
 S.teams.forEach((x,r)=>{for(let m=0;m<S.P;m++){const c=sc(r,m);if(!full(c))continue;played++;
  [0,1].forEach(s=>{const g=c[s],o=c[1-s];x[2*m+s].forEach(i=>{pt[i]+=(g>o?S.w:g==o?S.d:0)+g*S.g;pl[i]++;gl[i]+=g;if(g>o)w[i]++})})}});
 const o=[...Array(N).keys()].sort((a,b)=>pt[b]-pt[a]||gl[b]-gl[a]||w[b]-w[a]||a-b);
 let pos=0,p=null;const rows=o.map((i,x)=>{const key=pt[i]+'|'+gl[i]+'|'+w[i];if(key!=p){pos=x+1;p=key}return{i,pos,pt:pt[i],pl:pl[i],gl:gl[i],w:w[i]}});
 return{rows,played,total:S.R*S.P}}
function ranking(){
 const{rows,played,total}=stand(),fin=played==total,med=['🥇','🥈','🥉'];
 let h='<h1>'+(fin?'🏆 Klasyfikacja końcowa':'Ranking na bieżąco')+'</h1><div class="mut">'+esc(S.cat)+' · rozegrano '+played+' z '+total+' meczów<br>Wygrana '+S.w+', remis '+S.d+', bramka '+S.g+' pkt. Przy równych punktach: bramki, potem wygrane.</div>'+
 '<div class="card"><table><tr><th class="h">#</th><th class="n">Zawodnik</th><th class="c">Mecze</th><th class="c">Wyg.</th><th class="c">Gole</th><th class="c">Pkt</th></tr>';
 rows.forEach(r=>{h+='<tr'+(r.pos<=3&&r.pl?' class="top"':'')+'><td>'+(r.pos<=3&&r.pl?med[r.pos-1]:r.pos)+'</td><td class="n"><div class="nm">'+nm(r.i)+'</div></td><td>'+r.pl+'</td><td>'+r.w+'</td><td>'+r.gl+'</td><td><b>'+r.pt+'</b></td></tr>'});
 h+='</table></div>';
 const gt={};Object.keys(S.gs||{}).forEach(k=>{const i=+k.split('-')[1];gt[i]=(gt[i]||0)+S.gs[k]});
 const sl=Object.keys(gt).map(Number).filter(i=>gt[i]>0).sort((a,b)=>gt[b]-gt[a]||a-b);
 if(sl.length){h+='<h1>⚽ Strzelcy</h1><div class="card"><table><tr><th class="h">#</th><th class="n">Zawodnik</th><th class="c">Gole</th></tr>';let ps=0,pg=null;sl.forEach((i,x)=>{if(gt[i]!=pg){ps=x+1;pg=gt[i]}h+='<tr><td>'+ps+'</td><td class="n"><div class="nm">'+nm(i)+'</div></td><td><b>'+gt[i]+'</b></td></tr>'});h+='</table></div>'}
 return h+'<button class="btn" id="sh">Udostępnij / kopiuj klasyfikację</button>'}
function shareText(){
 const{rows,played,total}=stand();
 return (played==total?'Klasyfikacja końcowa':'Ranking')+' – '+S.cat+'\n'+rows.map(r=>r.pos+'. '+(raw(r.i)||code(r.i))+' – '+r.pt+' pkt ('+r.gl+' goli)').join('\n')}

function players(){
 const k=S.nk,P=S.nP,N=2*P*k,a=S.names.split('\n');
 const filled=Array.from({length:N},(_,i)=>(a[i]||'').trim()).filter(Boolean).length;
 const row=i=>'<div class="pr"><span class="cd">'+code(i,k)+'</span><input class="pi" data-i="'+i+'" value="'+esc(a[i]||'')+'" placeholder="Imię i nazwisko" autocomplete="off" autocapitalize="words" enterkeyhint="next"></div>';
 let h='<h1>Zawodnicy</h1><div class="mut">Wpisano <b id="cnt">'+filled+'</b> z '+N+' · Enter = następny zawodnik.'+(k>1?' Grupa = drużyna w rundzie 1.':'')+'</div>'+
 '<button class="btn s" id="pb">'+(S.paste?'Zamknij wklejanie':'Wklej listę (jedna osoba w linii)')+'</button>';
 if(S.paste)h+='<textarea id="pt" placeholder="Jan Kowalski&#10;Ola Nowak&#10;…"></textarea><button class="btn" id="pa">Zastosuj listę</button>';
 if(k==1){h+='<div class="card"><h3>Zawodnicy</h3>';for(let i=0;i<N;i++)h+=row(i);h+='</div>'}
 else for(let g=0;g<2*P;g++){h+='<div class="card"><h3>Grupa '+String.fromCharCode(65+g)+'</h3>';for(let j=0;j<k;j++)h+=row(g*k+j);h+='</div>'}
 return h}

const dR=(k,P)=>k==1?Math.min(20,Math.max(3,2*P-1)):k==3?10:9;
function settings(){
 const q=S.q;
 return '<h1>Ustawienia</h1><label>Kategoria</label><input id="cat" value="'+esc(S.cat)+'">'+
 '<label>Format (zawodników w drużynie)</label><select id="fmt">'+[1,2,3,4].map(k=>'<option value="'+k+'"'+(S.nk==k?' selected':'')+'>'+k+' × '+k+'</option>').join('')+'</select>'+
 '<label>Liczba boisk (2–13)</label><input id="pp" type="number" inputmode="numeric" min="2" max="13" value="'+S.nP+'">'+
 '<label>Liczba rund</label><input id="rr" type="number" inputmode="numeric" min="3" max="20" value="'+S.nR+'">'+
 '<div class="mut" style="margin-top:6px">Potrzeba <b>'+2*S.nP*S.nk+'</b> zawodników (każdy gra w każdej rundzie) – wpisz ich w zakładce Zawodnicy. Format 1 × 1: każdy gra sam z jednym rywalem.</div>'+
 '<label>Punktacja (porażka = 0)</label><div class="row3"><div><div class="mut">Wygrana</div><input class="pts" data-p="w" type="number" inputmode="numeric" value="'+S.w+'"></div><div><div class="mut">Remis</div><input class="pts" data-p="d" type="number" inputmode="numeric" value="'+S.d+'"></div><div><div class="mut">Za bramkę</div><input class="pts" data-p="g" type="number" inputmode="numeric" value="'+S.g+'"></div></div>'+
 '<button class="btn" id="go">Generuj turniej</button>'+
 (q?'<div class="card mut">Aktualny harmonogram: '+S.R+' rund, powtórzeni partnerzy: <b>'+q.pr+'</b>, powtórzeni rywale: <b>'+q.or+'</b>.</div>':'')+
 '<button class="btn s" id="rs">Wyczyść same wyniki</button>'+
 '<p class="mut">Dane zapisują się w przeglądarce telefonu. Zmiana formatu, boisk lub rund wymaga „Generuj” i kasuje wyniki. Zmiana punktacji przelicza ranking od razu.</p><p class="mut">Wersja 2</p>'}
function fit(){document.querySelectorAll('.nm').forEach(el=>{el.style.fontSize='';let f=parseFloat(getComputedStyle(el).fontSize)||15;while(el.scrollWidth>el.clientWidth+1&&f>8){f-=.5;el.style.fontSize=f+'px'}})}
function render(){
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab));
 $('#app').innerHTML=S.tab=='s'?settings():S.tab=='z'?players():!S.teams?'<p class="mut">Najpierw wygeneruj turniej w Ustawieniach.</p>':S.tab=='m'?matches():ranking();
 fit();save()}
document.addEventListener('click',e=>{
 if(!e.target.closest)return;const b=e.target.closest('button');if(!b)return;const D=b.dataset;
 if(D.t){S.tab=D.t;render();scrollTo(0,0)}
 else if(D.r!=null){S.rd=+D.r;render()}
 else if(D.g){const i=+D.i,s=+D.s,d=+D.g,key=S.rd+'-'+D.m,c=S.sc[key]=S.sc[key]||[null,null],kk=S.rd+'-'+i;S.gs=S.gs||{};const cur=S.gs[kk]||0;if(d<0&&!cur)return;
  S.gs[kk]=cur+d;if(c[s]==null)c[s]=0;if(c[1-s]==null)c[1-s]=0;c[s]=Math.max(0,c[s]+d);render()}
 else if(D.m!=null){const key=S.rd+'-'+D.m,c=S.sc[key]=S.sc[key]||[null,null],s=+D.s,d=+D.d;c[s]=c[s]==null?0:Math.max(0,c[s]+d);render()}
 else if(b.id=='rs'){if(confirm('Skasować wszystkie wyniki?')){S.sc={};S.gs={};render()}}
 else if(b.id=='pb'){S.paste=!S.paste;render()}
 else if(b.id=='pa'){S.names=$('#pt').value.split('\n').map(x=>x.trim()).filter(Boolean).join('\n');S.paste=false;render()}
 else if(b.id=='sh'){const t=shareText();
  if(navigator.share)navigator.share({text:t}).catch(()=>{});
  else navigator.clipboard.writeText(t).then(()=>alert('Skopiowano klasyfikację')).catch(()=>alert('Nie udało się skopiować'))}
 else if(b.id=='go'){
  if(S.teams&&Object.keys(S.sc).length&&!confirm('Nowy harmonogram skasuje wprowadzone wyniki. Kontynuować?'))return;
  b.textContent='Generuję…';b.disabled=true;
  setTimeout(()=>{S.k=S.nk;S.P=S.nP;S.R=S.nR;const g=gen(S.P,S.k,S.R,90000*S.P,7);S.teams=g.teams;S.q=g.q;S.sc={};S.gs={};S.rd=0;S.tab='m';render()},50)}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.classList.contains('pi')){const a=S.names.split('\n'),i=+t.dataset.i;while(a.length<=i)a.push('');a[i]=t.value.replace(/\n/g,' ');S.names=a.join('\n');
  const N=2*S.nP*S.nk;$('#cnt').textContent=Array.from({length:N},(_,j)=>(a[j]||'').trim()).filter(Boolean).length}
 else if(t.id=='cat')S.cat=t.value;
